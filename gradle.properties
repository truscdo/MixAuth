org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 26.1 构建需要 Java 25：toolchain 自动检测从环境变量读取 JDK 路径
# （JDK25_HOME / JDK21_HOME，可由 .env 或系统环境变量提供，见 .env.example）
# 构建时另需以 JDK 25 启动守护进程（build-matrix.bat / run-login-it.bat 自动处理）
org.gradle.java.installations.fromEnv=JDK25_HOME,JDK21_HOME

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.1
loader_version_range=[1,)

mod_id=mixauth
mod_name=MixAuth
mod_description=https://github.com/truscdo/MixAuth
mod_license=LGPL-3.0
mod_version=1.3.3
mod_group_id=io.github.truscdo.mixauth
# 测试专用 mod id：承载 test 源集内的 @Mod("mixauth_tests")（NeoForge testframework）。
# 与 Java 侧 @Mod 注解值保持一致（注解值须为编译期常量，无法引用本属性）。
test_mod_id=mixauth_tests
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

// 承载解包后的 testframework 的源集（见 neoForge.mods 块注释）
sourceSets {
    testframeworkMod
}

if (project.minecraft_version == '1.21.0' || project.minecraft_version == '1.21.1') {
    sourceSets.main.java.srcDir 'src/neo-1.21.1/java'
} else {
    // 1.21.2+ 用 8 参 teleportTo，排除主目录 6 参 TeleportCompat（避免重复类）
    sourceSets.main.java.srcDir 'src/neo-1.21.2/java'
    sourceSets.main.java.exclude { element ->
        element.name == 'TeleportCompat.java'
                && element.file.absolutePath.replace('\\', '/').contains('/src/main/java/')
    }
    if (project.minecraft_version == '1.21.11' || project.minecraft_version == '26.1.2'
            || project.minecraft_version == '26.2') {
        // 1.21.11 权限系统重构 + authlib GameProfile record 化：叠加第三源集承载
        // PermissionCompat / ProfileCompat 覆盖实现，并排除主目录基础版（避免重复类）
        // 26.1.2 / 26.2 复用同一覆盖实现
        sourceSets.main.java.srcDir 'src/neo-1.21.11/java'
        sourceSets.main.java.exclude { element ->
            (element.name == 'PermissionCompat.java' || element.name == 'ProfileCompat.java')
                    && element.file.absolutePath.replace('\\', '/').contains('/src/main/java/')
        }
    }
    if (project.minecraft_version == '26.2') {
        // 26.2 移除 PlayerInteractEvent.EntityInteractSpecific（interactAt 合并进
        // EntityInteract）：叠加第四源集承载 EntityInteractCompat 空实现，
        // 并排除主目录基础版（避免重复类）
        sourceSets.main.java.srcDir 'src/neo-26.2/java'
        sourceSets.main.java.exclude { element ->
            element.name == 'EntityInteractCompat.java'
                    && element.file.absolutePath.replace('\\', '/').contains('/src/main/java/')
        }
    }
}

if (project.minecraft_version != '1.21.0' && project.minecraft_version != '1.21.1') {
    sourceSets.test.java.exclude '**/gametest/**'
}

configurations {
    testframeworkModRuntime
}

base {
    // 产物名带 MC 版本后缀（多版本构建区分产物，如 mixauth-1.21.1-1.3.1.jar）
    archivesName = "${mod_id}-${minecraft_version}"
}

// 26.1 起 Minecraft 使用 Java 25；既有 1.21.x 线保持 Java 21
if (project.minecraft_version == '26.1.2' || project.minecraft_version == '26.2') {
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
} else {
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    // 26.1 起 Mojang 移除混淆，官方参数名直接可用，Parchment 不再必需
    if (project.minecraft_version != '26.1.2' && project.minecraft_version != '26.2') {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // 框架 id 为 mixauth:tests（namespace=mixauth），GameTest 结构模板命名空间即 mixauth；
            // 测试框架（@Mod mixauth_tests）的测试以 mixauth 命名空间承载，故此处只留 mixauth
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 独立测试运行目录：预写小值配置（mixauth-server.toml）/ server.properties / eula.txt，
            // 不污染开发用 run/ 目录；世界与 DB 随目录清理而重置（幂等）
            gameDirectory = file('run-gametest')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
        // 官方做法（对照 NeoForge tests/build.gradle）：testframework 必须声明为正式 mod
        // （source set → moddev 生成 legacyClasspath/目录条目），FML 才会以"目录 mod"加载它，
        // 其模块层才能访问 Minecraft 类。若仅放入 additionalRuntimeClasspath，FML 会把它当作
        // boot 层 classpath mod 加载，运行时出现 NoClassDefFoundError: net/minecraft/.../Component。
        testframework {
            sourceSet sourceSets.testframeworkMod
        }
    }

    // 官方解法：把 modding 依赖（Minecraft/NeoForge 本地 artifact）注入 test 源集的
    // compile/runtime classpath。moddev 对 neoforge 依赖的重定向仅对 main 生效，
    // 因此不能依赖 testImplementation "net.neoforged:neoforge"（无效且多余）。
    addModdingDependenciesTo sourceSets.test
}

// 解包 testframework jar → 目录：moddev 把 testframeworkMod 源集的 output 写入
// legacyClasspath，FML 以目录 mod 加载（同 mixauth 的 build/classes/java/main 行为）。
// 注意：只解包 testframework 本体（filter 掉传递依赖）。否则 testframework 的
// runtime 传递依赖 neoforge 会把 mcp/client、coremods 等混入目录，导致 testframework
// 模块导出 mcp.client 与 minecraft 模块 split-package 冲突（ResolutionException）。
def unpackTestframework = tasks.register('unpackTestframework', Sync) {
    from({
        configurations.testframeworkModRuntime
                .filter { it.name.contains('testframework') }
                .collect { zipTree(it) }
    })
    into layout.buildDirectory.dir('testframework-mod')
    // zipTree 解包时 jar 内 MANIFEST.MF 与目录条目可能重复，直接排除（目录 mod 无需 manifest）
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// 让 testframeworkMod 源集的类输出指向解包目录（无自有编译产物，纯 jar 内容）
sourceSets.testframeworkMod.output.classesDirs.from(unpackTestframework.map { it.destinationDir })

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // slf4j 版本须与 modding 依赖（minecraft-dependencies）的 strictly 2.0.9 约束一致，
    // 否则 testCompileClasspath 解析冲突
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // NeoForge testframework：GameTest 集成测试（版本与 neo_version 同步）
    // 注：Minecraft/NeoForge 类由 addModdingDependenciesTo sourceSets.test 注入，勿再加 neoforge 依赖
    // 注：dev 运行时 testframework 以"目录 mod"加载（mods.testframework → unpackTestframework），
    // 故不需要 additionalRuntimeClasspath（否则会以 boot 层 classpath mod 重复加载）
    testImplementation "net.neoforged:testframework:${project.neo_version}"
    testframeworkModRuntime "net.neoforged:testframework:${project.neo_version}"

    jarJar(implementation(group: 'at.favre.lib', name: 'bcrypt')) {
        version {
            strictly '[0.8.0, 0.11.0)'
            prefer '0.10.2'
        }
    }
    jarJar(implementation(group: 'at.favre.lib', name: 'bytes')) {
        version {
            strictly '[1.0.0, 2.0.0)'
            prefer '1.5.0'
        }
    }
    // additionalRuntimeClasspath 配置 1.21.11 起被 moddev 移除（构建报错提示），
    // 该配置仅用于 dev 运行时 classpath；1.21.11 起改用标准 runtimeOnly（26.1.2/26.2 同）。
    if (project.minecraft_version == '1.21.11' || project.minecraft_version == '26.1.2'
            || project.minecraft_version == '26.2') {
        runtimeOnly 'at.favre.lib:bcrypt:0.10.2'
        runtimeOnly 'at.favre.lib:bytes:1.5.0'
    } else {
        additionalRuntimeClasspath 'at.favre.lib:bcrypt:0.10.2'
        additionalRuntimeClasspath 'at.favre.lib:bytes:1.5.0'
    }
    jarJar(implementation(group: 'com.h2database', name: 'h2') {
        version {
            strictly '[2.1.210, 2.5.0)'
            prefer '2.4.240'
        }
    })
    if (project.minecraft_version == '1.21.11' || project.minecraft_version == '26.1.2'
            || project.minecraft_version == '26.2') {
        runtimeOnly 'com.h2database:h2:2.4.240'
    } else {
        additionalRuntimeClasspath 'com.h2database:h2:2.4.240'
    }
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    integrationTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Run L2/L3 login-chain integration tests against a NeoForge server'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    def lctLayer = (project.findProperty('lct.layer') ?: System.getenv('LCT_LAYER') ?: 'all') as String
    useJUnitPlatform {
        if (lctLayer == 'all') {
            includeTags 'online', 'offline'
        } else {
            includeTags lctLayer
        }
    }

    systemProperty 'lct.mc', project.minecraft_version
    systemProperty 'lct.neo', project.neo_version
    systemProperty 'lct.parchmentMc', project.parchment_minecraft_version
    systemProperty 'lct.parchmentMap', project.parchment_mappings_version
    systemProperty 'lct.mcRange', project.minecraft_version_range
    systemProperty 'lct.runDir', "${rootDir}/run-login/${project.minecraft_version}".toString()
    systemProperty 'lct.buildDir', layout.buildDirectory.get().asFile.absolutePath
    systemProperty 'lct.mccExe', System.getenv('MCC_EXE') ?: ''
    systemProperty 'lct.cleanBuild', System.getenv('L3_CLEAN_BUILD') ?: 'true'

    maxParallelForks = 1
    forkEvery = 1
    timeout = Duration.ofMinutes(20)

    reports.html.outputLocation.set(layout.buildDirectory.dir("reports/integrationTest"))
    reports.junitXml.outputLocation.set(layout.buildDirectory.dir("test-results/integrationTest"))

    jvmArgs '-Dfile.encoding=UTF-8'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }

    shouldRunAfter test
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_version            : mod_version,
            test_mod_id            : test_mod_id
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// GameTest 运行目录预写配置：运行 gameTestServer 前自动把 gametest-template/（版本库中）
// 同步到 run-gametest/（该目录整目录被 git 忽略）。Copy 只覆盖同名模板文件、不删除
// 运行产物（world/logs/DB 等）；README.md 不进入运行目录。
def syncGameTestTemplate = tasks.register('syncGameTestTemplate', Copy) {
    from 'gametest-template'
    exclude 'README.md'
    into 'run-gametest'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn syncGameTestTemplate
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}